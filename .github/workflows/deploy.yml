name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # served from https://<user>.github.io/<repo>/ ; set to "/" once a custom domain is used
          BASE_PATH: /${{ github.event.repository.name }}/
          # TURN credential URL (e.g. Metered). Kept as a secret so it is not committed; it is still visible
          # to anyone inspecting the deployed site, which only exposes relay quota, never user data.
          VITE_TURN_ENDPOINT: ${{ secrets.TURN_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
