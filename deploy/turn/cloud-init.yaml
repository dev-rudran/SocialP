#cloud-config
# SocialP relay (coturn) for an Oracle Cloud Always Free Ubuntu VM.
# Replace __TURN_USER__ and __TURN_PASS__ before pasting into "Advanced options → Initialization script".
# Everything else is automatic: public IP detection, firewall, optional TLS via <ip>.sslip.io.

package_update: true
packages:
  - coturn
  - certbot
  - iptables-persistent

write_files:
  - path: /opt/socialp-turn/turnserver.conf.tpl
    permissions: '0600'
    content: |
      # --- SocialP relay ---
      realm=socialp
      server-name=socialp-relay
      fingerprint
      lt-cred-mech
      user=__TURN_USER__:__TURN_PASS__

      listening-port=3478
      listening-ip=__PRIVATE_IP__
      relay-ip=__PRIVATE_IP__
      external-ip=__PUBLIC_IP__/__PRIVATE_IP__
      min-port=49152
      max-port=65535

      # Abuse limits: one shared login is used by every app user
      total-quota=1000
      max-bps=3000000
      stale-nonce=600

      # Never relay into private, loopback or cloud-metadata networks (prevents SSRF)
      no-multicast-peers
      denied-peer-ip=0.0.0.0-0.255.255.255
      denied-peer-ip=10.0.0.0-10.255.255.255
      denied-peer-ip=100.64.0.0-100.127.255.255
      denied-peer-ip=127.0.0.0-127.255.255.255
      denied-peer-ip=169.254.0.0-169.254.255.255
      denied-peer-ip=172.16.0.0-172.31.255.255
      denied-peer-ip=192.0.0.0-192.0.0.255
      denied-peer-ip=192.0.2.0-192.0.2.255
      denied-peer-ip=192.168.0.0-192.168.255.255
      denied-peer-ip=198.18.0.0-198.19.255.255
      denied-peer-ip=198.51.100.0-198.51.100.255
      denied-peer-ip=203.0.113.0-203.0.113.255
      denied-peer-ip=224.0.0.0-255.255.255.255
      denied-peer-ip=::1
      denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

      no-cli
      no-tlsv1
      no-tlsv1_1
      no-stdout-log
      syslog
      simple-log
      __TLS_BLOCK__

  - path: /etc/systemd/system/coturn.service.d/socialp.conf
    content: |
      [Service]
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      LimitNOFILE=65536

  - path: /opt/socialp-turn/setup.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -euo pipefail
      PRIVATE_IP=$(hostname -I | awk '{print $1}')
      PUBLIC_IP=$(curl -fsS --max-time 10 https://api.ipify.org || curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '\n')
      HOST="${PUBLIC_IP//./-}.sslip.io"

      # Oracle's Ubuntu images REJECT everything not explicitly allowed; open the relay ports.
      for rule in "-p udp --dport 3478" "-p tcp --dport 3478" "-p tcp --dport 443" "-p tcp --dport 80" "-p udp --dport 49152:65535"; do
        iptables -I INPUT -m state --state NEW $rule -j ACCEPT
      done
      netfilter-persistent save

      : > /opt/socialp-turn/tls.conf
      TLS=""
      if certbot certonly --standalone --non-interactive --agree-tos --register-unsafely-without-email -d "$HOST"; then
        install -d -o turnserver -g turnserver /etc/coturn
        install -o turnserver -g turnserver -m 0600 /etc/letsencrypt/live/$HOST/fullchain.pem /etc/coturn/cert.pem
        install -o turnserver -g turnserver -m 0600 /etc/letsencrypt/live/$HOST/privkey.pem /etc/coturn/key.pem
        printf 'tls-listening-port=443\ncert=/etc/coturn/cert.pem\npkey=/etc/coturn/key.pem\n' > /opt/socialp-turn/tls.conf
        TLS="turns:$HOST:443"
        cat > /etc/letsencrypt/renewal-hooks/deploy/coturn.sh <<HOOK
      #!/bin/sh
      install -o turnserver -g turnserver -m 0600 /etc/letsencrypt/live/$HOST/fullchain.pem /etc/coturn/cert.pem
      install -o turnserver -g turnserver -m 0600 /etc/letsencrypt/live/$HOST/privkey.pem /etc/coturn/key.pem
      systemctl restart coturn
      HOOK
        chmod +x /etc/letsencrypt/renewal-hooks/deploy/coturn.sh
      fi

      sed -e "s/__PRIVATE_IP__/$PRIVATE_IP/g" -e "s/__PUBLIC_IP__/$PUBLIC_IP/g" /opt/socialp-turn/turnserver.conf.tpl \
        | sed -e '/__TLS_BLOCK__/{r /opt/socialp-turn/tls.conf' -e 'd}' > /etc/turnserver.conf
      chown root:turnserver /etc/turnserver.conf && chmod 0640 /etc/turnserver.conf
      [ -f /etc/default/coturn ] && sed -i 's/^#\?TURNSERVER_ENABLED=.*/TURNSERVER_ENABLED=1/' /etc/default/coturn
      systemctl daemon-reload
      systemctl enable --now coturn
      systemctl restart coturn
      echo "SocialP relay ready: turn:$PUBLIC_IP:3478  tls: ${TLS:-none}" | tee /opt/socialp-turn/READY

runcmd:
  - /opt/socialp-turn/setup.sh
